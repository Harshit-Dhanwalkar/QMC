name: Build GR (cached)
description: Build and install the GR submodule once per OS, compiler and submodule commit
inputs:
  compiler:
    description: gcc or clang
    required: false
    default: gcc
runs:
  using: composite
  steps:
    - name: Get GR submodule commit
      id: gr-sha
      shell: bash
      run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache GR build
      id: gr-cache
      uses: actions/cache@v6
      with:
        path: third_party/gr/install
        key: gr-${{ runner.os }}-${{ inputs.compiler }}-${{ steps.gr-sha.outputs.sha }}

    - name: Build GR
      if: steps.gr-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: |
        if [ "$COMPILER" = clang ]; then CXX=clang++; else CXX=g++; fi
        cmake -S third_party/gr -B third_party/gr/build \
          -Wno-dev \
          -DCMAKE_C_COMPILER="$COMPILER" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_FLAGS="-w" \
          -DCMAKE_CXX_FLAGS="-w" \
          -DGR_INSTALL=ON \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/third_party/gr/install" \
          -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
        cmake --build third_party/gr/build --parallel
        cmake --install third_party/gr/build

    - name: Verify GR install
      shell: bash
      run: |
        for f in lib/libGR.so lib/libGR3.so lib/x11plugin.so include/gr.h include/gks.h include/gr3.h; do
          if [ -f "third_party/gr/install/$f" ]; then echo " OK: $f"; else echo "::error::GR install is missing $f"; exit 1; fi
        done
