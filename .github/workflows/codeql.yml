name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE', 'LICENCE']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE', 'LICENCE']
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

# Read-only by default; job asks for security-events itself
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      # No submodules: default plot backend falls back when GR is absent
      # Do not want third_party/gr in CodeQL database
      - uses: actions/checkout@v7

      - name: Install build dependencies
        if: matrix.language == 'c-cpp'
        uses: ./.github/actions/setup-deps

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - third_party/**
              - build/**
              - tests/**
              - examples/**
              - benchmarks/**
              - docs/**
              - wasm/test/**

      - name: Build (traced by CodeQL)
        if: matrix.language == 'c-cpp'
        run: make -j"$(nproc)" all

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
