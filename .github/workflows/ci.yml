name: QMC CI Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake gnuplot

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v4
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Verify GR install
        run: |
          ls third_party/gr/install/lib/libGR.so
          ls third_party/gr/install/include/gr.h

      - name: Build All
        run: make all PLOT_BACKEND=GR

      - name: Run Test Suite
        run: make run-tests PLOT_BACKEND=GR
