name: QMC CI Build

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENCE'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENCE'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            build-essential cmake gnuplot clang libomp-dev
            libjpeg-dev libpng-dev libfreetype6-dev libfontconfig1-dev
            libqhull-dev zlib1g-dev
            libx11-dev libxt-dev libxrender-dev libxext-dev
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
            libxt6 libxrender1 libxext6 libglx-mesa0 libqt6widgets6 qtbase5-dev
            liblapacke-dev liblapack-dev libblas-dev liblapack-test
            libhdf5-dev libnetcdf-dev
          version: 1.0

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v6
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-${{ matrix.compiler }}-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -Wno-dev \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Verify GR install and plugins
        run: |
          for file in \
            third_party/gr/install/lib/libGR.so \
            third_party/gr/install/include/gr.h \
            third_party/gr/install/include/gks.h \
            third_party/gr/install/include/gr3.h \
            third_party/gr/install/lib/libGR3.so \
            third_party/gr/install/lib/x11plugin.so; do
            if [ -f "$file" ]; then
              echo " OK: $file"
            else
              echo " ERROR: $file missing!" && exit 1
            fi
          done

      - name: Build All
        # run: make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR
        # run: make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_LAPACK=1
        run: make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1
        # run: make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 USE_LAPACK=1

      - name: Run Test Suite
        # run: make run-tests CC=${{ matrix.compiler }} PLOT_BACKEND=GR
        # run: make run-tests CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_LAPACK=1
        run: make run-tests CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1
        # run: make run-tests CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 USE_LAPACK=1

      # - name: Run Example Binaries
      #   run: make run-examples CC=${{ matrix.compiler }} PLOT_BACKEND=GR
      #
      # - name: Upload Generated Output Artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: plot-outputs-${{ matrix.compiler }}
      #     path: output/
      #     retention-days: 7

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Analysis Tools
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            cppcheck clang-tidy
            build-essential cmake gnuplot libomp-dev
            libjpeg-dev libpng-dev libfreetype6-dev libfontconfig1-dev
            libqhull-dev zlib1g-dev
            libx11-dev libxt-dev libxrender-dev libxext-dev
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
            libxt6 libxrender1 libxext6 libglx-mesa0 libqt6widgets6 qtbase5-dev
            liblapacke-dev liblapack-dev libblas-dev liblapack-test
            libhdf5-dev libnetcdf-dev
          version: 1.0

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v6
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-gcc-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -Wno-dev \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Verify GR install and plugins
        run: |
          for file in \
            third_party/gr/install/lib/libGR.so \
            third_party/gr/install/include/gr.h \
            third_party/gr/install/include/gks.h \
            third_party/gr/install/include/gr3.h \
            third_party/gr/install/lib/libGR3.so \
            third_party/gr/install/lib/x11plugin.so; do
            if [ -f "$file" ]; then
              echo " OK: $file"
            else
              echo " ERROR: $file missing!" && exit 1
            fi
          done

      - name: Run Cppcheck
        # run: |
        #   cppcheck --enable=warning,performance,portability \
        #            --suppress=constVariable \
        #            --suppress=constParameterPointer \
        #            --error-exitcode=1 \
        #            --inline-suppr \
        #            -I core -I physics -I export .
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -I core -I physics -I export \
                   -i third_party -i build .

      # - name: Install bear and generate compilation database
      #   run: |
      #     sudo apt-get install -y bear
      #     bear -- make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR
      - name: Install compiledb
        run: pip install compiledb

      - name: Generate compilation database
        run: |
          make clean
          compiledb make all CC=gcc PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1

      - name: Run Clang-Tidy
        run: |
          find $(pwd)/core $(pwd)/physics $(pwd)/export -name "*.c" \
               -not -path "*/third_party/*" -not -path "*/build/*" \
            | xargs clang-tidy -p . --config-file=.clang-tidy -warnings-as-errors=*

  valgrind-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies & Valgrind
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            build-essential valgrind gnuplot libomp-dev
          version: 1.0

      - name: Run Tests under Valgrind
        run: |
          make clean
          # make tests SANITIZE=0
          # for t in build/test_*; do
          #    [ -x "$t" ] || continue
          #    case "$t" in *.d) continue ;; esac
          #    valgrind --leak-check=full \
          #             --error-exitcode=1 \
          #             --suppressions=valgrind.supp \
          #             --errors-for-leak-kinds=definite,indirect \
          #             "$t" || exit 1
          # done
          make valgrind

  sanitizers:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: APT timeouts
        run: |
          echo 'Acquire::http::Timeout "30";'  | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::Retries "2";'         | sudo tee -a /etc/apt/apt.conf.d/99timeout

      - name: Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            build-essential cmake gnuplot clang libomp-dev
            libjpeg-dev libpng-dev libfreetype6-dev libfontconfig1-dev
            libqhull-dev zlib1g-dev
            libx11-dev libxt-dev libxrender-dev libxext-dev
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
            libxt6 libxrender1 libxext6 libglx-mesa0 libqt6widgets6 qtbase5-dev
            libhdf5-dev libnetcdf-dev
          version: 1.0

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v6
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-gcc-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -Wno-dev \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Run Tests with Sanitizers
        run: |
          make clean
          export LSAN_OPTIONS="suppressions=$PWD/lsan.supp"
          # make run-tests PLOT_BACKEND=GR EXTRA_CFLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          make run-tests PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 \
            EXTRA_CFLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          # make run-tests PLOT_BACKEND=GR CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined"

  wasm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up PATH
        run: echo "$GITHUB_WORKSPACE/bin/zig" >> $GITHUB_PATH

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v6
        with:
          path: bin/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin/zig
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ --strip-components=1 -C bin/zig

      - name: Sanity-check Zig on PATH
        run: |
          command -v zig
          zig version

      - name: Build WASM playground
        run: |
          chmod +x wasm/build.sh
          ./wasm/build.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Native vs WASM agreement + fringe physics
        run: |
          chmod +x wasm/test/run.sh
          ./wasm/test/run.sh

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            build-essential cmake gnuplot libomp-dev lcov
            libjpeg-dev libpng-dev libfreetype6-dev libfontconfig1-dev
            libqhull-dev zlib1g-dev
            libx11-dev libxt-dev libxrender-dev libxext-dev
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
            libxt6 libxrender1 libxext6 libglx-mesa0 libqt6widgets6 qtbase5-dev
            liblapacke-dev liblapack-dev libblas-dev liblapack-test
            libhdf5-dev libnetcdf-dev
          version: 1.0

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v6
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-gcc-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -Wno-dev \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Build and run tests with coverage instrumentation
        run: |
          make clean
          make run-tests PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 SANITIZE=0 \
            EXTRA_CFLAGS="-O0 -g --coverage"

      - name: Generate lcov report
        run: |
          lcov --capture --directory . --output-file coverage.info \
            --ignore-errors mismatch,gcov,source,negative
          lcov --remove coverage.info \
            '/usr/*' '*/third_party/*' '*/tests/*' '*/export/*' '*/benchmarks/*' \
            --output-file coverage.info --ignore-errors unused,negative

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
