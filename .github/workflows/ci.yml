name: QMC CI Build

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENCE"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENCE"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      physics: ${{ steps.filter.outputs.physics }}
      tests: ${{ steps.filter.outputs.tests }}
      makefile: ${{ steps.filter.outputs.makefile }}
      wasm: ${{ steps.filter.outputs.wasm }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            physics:
              - 'physics/**'
            tests:
              - 'tests/**'
            makefile:
              - 'Makefile'
              - 'CMakeLists.txt'
            wasm:
              - 'wasm/**'
            workflows:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: clang

      - uses: ./.github/actions/setup-gr
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build All
        run: make -j"$(nproc)" all CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1

      - name: Run Test Suite
        run: make run-tests CC=${{ matrix.compiler }} PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1

      # - name: Run Example Binaries
      #   run: make run-examples CC=${{ matrix.compiler }} PLOT_BACKEND=GR
      #
      # - name: Upload Generated Output Artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: plot-outputs-${{ matrix.compiler }}
      #     path: output/
      #     retention-days: 7

  static-analysis:
    needs: changes
    if: |
      !cancelled() &&
      (needs.changes.outputs.physics == 'true' ||
       needs.changes.outputs.core    == 'true' ||
       needs.changes.outputs.tests   == 'true' ||
       needs.changes.outputs.makefile == 'true' ||
       needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: cppcheck clang-tidy

      - uses: ./.github/actions/setup-gr

      - name: Run Cppcheck
        # run: |
        #   cppcheck --enable=warning,performance,portability \
        #            --suppress=constVariable \
        #            --suppress=constParameterPointer \
        #            --error-exitcode=1 \
        #            --inline-suppr \
        #            -I core -I physics -I export .
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   -I core -I physics -I export \
                   -i third_party -i build .

      # - name: Install bear and generate compilation database
      #   run: |
      #     sudo apt-get install -y bear
      #     bear -- make all CC=${{ matrix.compiler }} PLOT_BACKEND=GR
      - name: Install compiledb
        run: pip install compiledb

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Generate compilation database
        run: |
          make clean
          compiledb make all CC=gcc PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1

      - name: Run Clang-Tidy
        run: |
          find "$PWD/core" "$PWD/physics" "$PWD/export" -name "*.c" \
               -not -path "*/third_party/*" -not -path "*/build/*" \
            | xargs -P "$(nproc)" -n 8 clang-tidy -p . --config-file=.clang-tidy -warnings-as-errors='*'

  sanitizers:
    needs: [changes, build-and-test]
    if: |
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      (needs.changes.outputs.physics == 'true' ||
       needs.changes.outputs.core    == 'true' ||
       needs.changes.outputs.tests   == 'true' ||
       needs.changes.outputs.makefile == 'true' ||
       needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: clang

      - uses: ./.github/actions/setup-gr

      - name: Run Tests with Sanitizers
        run: |
          make clean
          export LSAN_OPTIONS="suppressions=$PWD/lsan.supp"
          make run-tests PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 \
            EXTRA_CFLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

  install-check:
    needs: changes
    if: |
      !cancelled() &&
      (needs.changes.outputs.core     == 'true' ||
       needs.changes.outputs.physics  == 'true' ||
       needs.changes.outputs.makefile == 'true' ||
       needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: clang

      - name: Install and build a downstream consumer
        run: make check-install CC=${{ matrix.compiler }} PLOT_BACKEND=NONE -j"$(nproc)"

  wasm-check:
    needs: changes
    if: |
      !cancelled() &&
      (needs.changes.outputs.wasm    == 'true' ||
       needs.changes.outputs.physics == 'true' ||
       needs.changes.outputs.core    == 'true' ||
       needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZIG_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up PATH
        run: echo "$GITHUB_WORKSPACE/bin/zig" >> "$GITHUB_PATH"

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v6
        with:
          path: bin/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin/zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ --strip-components=1 -C bin/zig

      - name: Sanity-check Zig on PATH
        run: |
          command -v zig
          zig version

      - name: Build WASM playground
        run: |
          chmod +x wasm/build.sh
          ./wasm/build.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Native vs WASM agreement + fringe physics
        run: |
          chmod +x wasm/test/run.sh
          ./wasm/test/run.sh

  # Single required check for branch protection: skipped-by-filter jobs
  # count as success, a failed or cancelled one does not
  ci-ok:
    if: always()
    needs: [build-and-test, static-analysis, sanitizers, install-check, wasm-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a CI job ended as '$r'"; exit 1 ;; esac
          done
