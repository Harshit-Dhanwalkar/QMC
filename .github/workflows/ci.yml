name: QMC CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gnuplot

      - name: Build All
        run: make all PLOT_BACKEND=GR
        # run: make all PLOT_BACKEND=GNUPLOT

      - name: Run Test Suite
        run: make run-tests PLOT_BACKEND=GR
        # run: make run-tests PLOT_BACKEND=GNUPLOT
