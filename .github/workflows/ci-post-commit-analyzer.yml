name: Post-Commit Static Analyzer

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENCE"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/valgrind-check.yml"
  schedule:
    - cron: "30 0 * * *" # nightly, 00:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-commit-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # full recompile + symbolic exec

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: clang clang-tools

      - uses: ./.github/actions/setup-gr

      - name: Sanity-check scan-build
        run: |
          command -v scan-build
          scan-build --version || true

      - name: Run scan-build
        run: |
          make clean
          scan-build \
            --use-cc=clang \
            --keep-empty \
            -v \
            -o analyzer-results \
            make -j"$(nproc)" all LATEX=0 PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 \
            2>&1 | tee scan-build.log

      - name: Summarize findings
        if: always()
        run: |
          n=$(grep -Eo 'scan-build: [0-9]+ bugs? found' scan-build.log | grep -Eo '[0-9]+' | tail -1 || true)
          {
            echo '### Clang static analyzer'
            echo "Bugs found: **${n:-unknown}**"
            echo
            echo 'Download the `analyzer-html` artifact and open the report `index.html`.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${n:-0}" != 0 ]; then echo "::warning::scan-build reported ${n} bug(s)"; fi

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-html
          path: analyzer-results/
          retention-days: 14
          if-no-files-found: warn
