name: Post-Commit Static Analyzer

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENCE'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/coverage.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/valgrind-check.yml'
  schedule:
    - cron: '30 0 * * *'   # nightly, 00:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-commit-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # full recompile + symbolic exec

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: APT timeouts
        run: |
          echo 'Acquire::http::Timeout "30";'  | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::Retries "2";'         | sudo tee -a /etc/apt/apt.conf.d/99timeout

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake gnuplot clang clang-tools libomp-dev \
            libjpeg-dev libpng-dev libfreetype6-dev libfontconfig1-dev \
            libqhull-dev zlib1g-dev \
            libx11-dev libxt-dev libxrender-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev \
            libxt6 libxrender1 libxext6 libglx-mesa0 libqt6widgets6 qtbase5-dev \
            liblapacke-dev liblapack-dev libblas-dev liblapack-test \
            libhdf5-dev libnetcdf-dev

      - name: Sanity-check scan-build
        run: |
          command -v scan-build
          scan-build --version || true

      - name: Get GR submodule commit
        id: gr-sha
        run: echo "sha=$(git -C third_party/gr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GR build
        id: gr-cache
        uses: actions/cache@v6
        with:
          path: third_party/gr/install
          key: gr-${{ runner.os }}-gcc-${{ steps.gr-sha.outputs.sha }}

      - name: Build GR
        if: steps.gr-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/gr -B third_party/gr/build \
            -Wno-dev \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGR_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/third_party/gr/install \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt4=ON
          cmake --build third_party/gr/build --parallel
          cmake --install third_party/gr/build

      - name: Verify GR install and plugins
        run: |
          for file in \
            third_party/gr/install/lib/libGR.so \
            third_party/gr/install/include/gr.h \
            third_party/gr/install/include/gks.h \
            third_party/gr/install/include/gr3.h \
            third_party/gr/install/lib/libGR3.so \
            third_party/gr/install/lib/x11plugin.so; do
            if [ -f "$file" ]; then
              echo " OK: $file"
            else
              echo " ERROR: $file missing!" && exit 1
            fi
          done

      - name: Clean previous build
        run: make clean

      - name: Run scan-build
        run: |
          scan-build \
            --use-cc=clang \
            --keep-empty \
            -v \
            -o analyzer-results \
            make all PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1

      - name: Summarize findings
        if: always()
        run: |
          if [ -d analyzer-results ]; then
            echo "::group::Analyzer report directories"
            ls -la analyzer-results/ || true
            echo "::endgroup::"
            echo "::group::Findings index files"
            find analyzer-results -maxdepth 3 -name 'index.html' -print || true
            echo "::endgroup::"
          else
            echo "No analyzer-results directory was produced."
          fi

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: analyzer-html
          path: analyzer-results/
          retention-days: 14
          if-no-files-found: warn
