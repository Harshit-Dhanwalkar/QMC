name: Fuzz

# NOTE: tests/test_molecular_integrals_fuzz.c is a property-based test with its
# own main() and fixed seeds. It is not a libFuzzer target (no LLVMFuzzerTestOneInput),
# so building it with -fsanitize=fuzzer and passing -max_total_time/corpus

on:
  pull_request:
    paths:
      - "physics/molecular_integrals.*"
      - "core/**"
      - "tests/test_molecular_integrals_fuzz.c"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/**"
  schedule:
    - cron: "23 2 * * 0" # Sundays 02:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-tests:
    name: property tests (${{ matrix.cc }} + ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          extra: clang

      - name: Build
        run: |
          ${{ matrix.cc }} -std=gnu11 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I. -Icore -Icore/linalg -Iphysics \
            tests/test_molecular_integrals_fuzz.c \
            physics/molecular_integrals.c \
            core/*.c core/*/*.c \
            -lm -fopenmp -o prop_molecular_integrals

      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/lsan.supp
        run: ./prop_molecular_integrals
