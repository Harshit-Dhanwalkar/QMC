name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_KATEX_VERSION: "0.10.0-alpha"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      # Install and Cache mdBook
      - name: Cache mdBook
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: bin/mdbook
          key: mdbook-v${{ env.MDBOOK_VERSION }}-${{ runner.os }}

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C bin

      # Install and Cache mdbook-katex
      - name: Cache mdbook-katex
        id: cache-katex
        uses: actions/cache@v4
        with:
          path: bin/mdbook-katex
          key: mdbook-katex-v${{ env.MDBOOK_KATEX_VERSION }}-${{ runner.os }}

      - name: Install mdbook-katex via Cargo
        if: steps.cache-katex.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          cargo install mdbook-katex --version "${MDBOOK_KATEX_VERSION}" --root .
          # cargo install --root . puts binaries in ./bin/

      - name: Install mdbook-linkcheck
        run: |
          curl -sSL https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck-v0.7.7-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C bin

      # Build, Validate links and Deploy Docs
      - name: Build Documentation
        run: mdbook build docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
