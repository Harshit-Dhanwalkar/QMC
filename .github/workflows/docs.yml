name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.3
      MDBOOK_KATEX_VERSION: 0.10.0-alpha
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook & mdbook-katex
        run: |
          # Install mdBook
          wget -q https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          sudo mv mdbook /usr/local/bin/

          # Install mdbook-katex
          wget -q https://github.com/lzanini/mdbook-katex/releases/download/${MDBOOK_KATEX_VERSION}-binaries/mdbook-katex-v${MDBOOK_KATEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook-katex-v${MDBOOK_KATEX_VERSION}-*-unknown-linux-gnu.tar.gz
          sudo mv mdbook-katex /usr/local/bin/

      - name: Build docs
        run: mdbook build docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
