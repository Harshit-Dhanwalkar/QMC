name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "wasm/**"
      - "physics/bloch.c"
      - "physics/bloch.h"
      - "physics/lindblad.c"
      - "physics/lindblad.h"
      - "physics/rabi.c"
      - "physics/rabi.h"
      - "physics/soft.c"
      - "physics/soft.h"
      - "core/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_KATEX_VERSION: "0.10.0"
      MDBOOK_LINKCHECK2_VERSION: "0.12.2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      # ------------------ mdBook toolchain  -------------------
      # Cache mdBook
      - name: Cache mdBook
        id: cache-mdbook
        uses: actions/cache@v6
        with:
          path: bin/mdbook
          key: mdbook-v${{ env.MDBOOK_VERSION }}-${{ runner.os }}

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C bin

      # Cache mdbook-katex
      - name: Cache mdbook-katex
        id: cache-katex
        uses: actions/cache@v6
        with:
          path: bin/mdbook-katex
          key: mdbook-katex-v${{ env.MDBOOK_KATEX_VERSION }}-${{ runner.os }}

      - name: Install mdbook-katex
        if: steps.cache-katex.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          cargo install mdbook-katex --version "${MDBOOK_KATEX_VERSION}" --root .

      # Cache mdbook-linkcheck2
      - name: Cache mdbook-linkcheck2
        id: cache-linkcheck2
        uses: actions/cache@v6
        with:
          path: bin/mdbook-linkcheck2
          key: mdbook-linkcheck2-v${{ env.MDBOOK_LINKCHECK2_VERSION }}-${{ runner.os }}

      - name: Install mdbook-linkcheck2
        if: steps.cache-linkcheck2.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL -o bin/mdbook-linkcheck2.tar.gz \
            "https://github.com/marxin/mdbook-linkcheck2/releases/download/v${MDBOOK_LINKCHECK2_VERSION}/mdbook-linkcheck2-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf bin/mdbook-linkcheck2.tar.gz -C bin
          chmod +x bin/mdbook-linkcheck2
          rm bin/mdbook-linkcheck2.tar.gz

      # ---------------------- WASM playground  ---------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip

      - name: Install Zig (used by wasm/build.sh when emcc is absent)
        run: pip install ziglang

      - name: Build WASM playground
        run: |
          chmod +x wasm/build.sh
          ./wasm/build.sh

      - name: Verify WASM artifacts landed in docs tree
        run: |
          for f in docs/src/playground/qmc.wasm \
                   docs/src/playground/qmc_anderson.wasm \
                   docs/src/playground/qmc_bloch.wasm \
                   docs/src/playground/qmc_butterfly.wasm \
                   docs/src/playground/qmc_dirac.wasm \
                   docs/src/playground/qmc_orbital.wasm; do
            test -s "$f" \
              && echo " OK: $f ($(stat -c%s "$f") bytes)" \
              || (echo "ERROR: $f missing" && exit 1)
          done

      # ------------------- Build & deploy --------------------------
      # Build, Validate links and Deploy Docs
      - name: Build Documentation
        run: mdbook build docs/ --dest-dir "$(pwd)/docs/book"

      - name: Copy WASM into book output
        run: |
          for f in qmc.wasm qmc_butterfly.wasm qmc_dirac.wasm qmc_orbital.wasm qmc_bloch.wasm qmc_anderson.wasm; do
            cp "docs/src/playground/$f" "docs/book/html/playground/$f"
          done

      - name: Confirm playground survived mdBook's asset copy
        run: |
          for f in docs/book/html/playground/qmc.wasm \
                   docs/book/html/playground/qmc_anderson.wasm \
                   docs/book/html/playground/qmc_bloch.wasm \
                   docs/book/html/playground/qmc_butterfly.wasm \
                   docs/book/html/playground/qmc_dirac.wasm \
                   docs/book/html/playground/qmc_orbital.wasm \
                   docs/book/html/playground/index.html \
                   docs/book/html/playground/anderson.html \
                   docs/book/html/playground/bloch.html \
                   docs/book/html/playground/butterfly.html \
                   docs/book/html/playground/dirac.html \
                   docs/book/html/playground/orbitals.html; do
            test -s "$f" \
              && echo " OK: $f" \
              || (echo "ERROR: $f missing from book output" && exit 1)
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
