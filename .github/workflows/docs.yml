name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "wasm/**"
      - "physics/**"
      - "core/**"
      - "tests/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "wasm/**"
      - "physics/**"
      - "core/**"
      - ".github/workflows/docs.yml"
  workflow_run:
    workflows: ["Coverage"]
    types: [completed]
  workflow_dispatch:

# Build-only permissions; deploy job asks for pages/id-token itself
permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_KATEX_VERSION: "0.10.0"
      MDBOOK_LINKCHECK2_VERSION: "0.12.2"
      ZIG_VERSION: "0.13.0"
      WASM_MODULES: >-
        qmc.wasm
        qmc_anderson.wasm qmc_bloch.wasm qmc_butterfly.wasm qmc_dirac.wasm
        qmc_orbital.wasm qmc_qwalk.wasm qmc_lz.wasm qmc_rotor.wasm
        qmc_ssh.wasm qmc_tfim.wasm qmc_haldane.wasm qmc_wigner.wasm
        qmc_grover.wasm qmc_bell.wasm qmc_carpet.wasm qmc_zeno.wasm
        qmc_corral.wasm qmc_hubbard.wasm qmc_ring.wasm qmc_tunnel.wasm
      PLAYGROUND_HTML: >-
        index.html anderson.html bloch.html butterfly.html dirac.html
        orbitals.html quantum_walk.html landau_zener.html kicked_rotor.html
        ssh_chain.html ising_quench.html haldane.html wigner.html grover.html
        bell.html carpet.html zeno.html corral.html hubbard.html ring.html
        tunnel.html
        wasi-shim.js nav.js

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up PATH
        run: |
          echo "$GITHUB_WORKSPACE/bin"       >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/bin/zig"   >> $GITHUB_PATH

      # ------------------ mdBook toolchain  -------------------
      # Cache mdBook
      - name: Cache mdBook
        id: cache-mdbook
        uses: actions/cache@v6
        with:
          path: bin/mdbook
          key: mdbook-v${{ env.MDBOOK_VERSION }}-${{ runner.os }}

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C bin

      # Cache mdbook-katex
      - name: Cache mdbook-katex
        id: cache-katex
        uses: actions/cache@v6
        with:
          path: bin/mdbook-katex
          key: mdbook-katex-v${{ env.MDBOOK_KATEX_VERSION }}-${{ runner.os }}

      - name: Install mdbook-katex
      #   if: steps.cache-katex.outputs.cache-hit != 'true'
      #   run: |
      #     mkdir -p bin
      #     cargo install mdbook-katex --version "${MDBOOK_KATEX_VERSION}" --root .
        if: steps.cache-katex.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL -o bin/katex.tar.gz \
            "https://github.com/lzanini/mdbook-katex/releases/download/v${MDBOOK_KATEX_VERSION}/mdbook-katex-v${MDBOOK_KATEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf bin/katex.tar.gz -C bin
          chmod +x bin/mdbook-katex
          rm bin/katex.tar.gz

      # Cache mdbook-linkcheck2
      - name: Cache mdbook-linkcheck2
        id: cache-linkcheck2
        uses: actions/cache@v6
        with:
          path: bin/mdbook-linkcheck2
          key: mdbook-linkcheck2-v${{ env.MDBOOK_LINKCHECK2_VERSION }}-${{ runner.os }}

      - name: Install mdbook-linkcheck2
        if: steps.cache-linkcheck2.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL -o bin/mdbook-linkcheck2.tar.gz \
            "https://github.com/marxin/mdbook-linkcheck2/releases/download/v${MDBOOK_LINKCHECK2_VERSION}/mdbook-linkcheck2-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf bin/mdbook-linkcheck2.tar.gz -C bin
          chmod +x bin/mdbook-linkcheck2
          rm bin/mdbook-linkcheck2.tar.gz

      # ---------------------- WASM playground  ---------------------
      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v6
        with:
          path: bin/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin/zig
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ --strip-components=1 -C bin/zig

      - name: Build WASM playground
        run: |
          chmod +x wasm/build.sh
          ./wasm/build.sh

      - name: Verify WASM artifacts landed in docs tree
        run: |
          fail=0
          for f in ${{ env.WASM_MODULES }}; do
            p="docs/src/playground/$f"
            if [ -s "$p" ]; then
              echo " OK: $p ($(stat -c%s "$p") bytes)"
            else
              echo " ERROR: $p missing or empty"
              fail=1
            fi
          done
          exit $fail

      # ------------------- Build & deploy --------------------------
      # Build, Validate links and Deploy Docs
      - name: Build Documentation
        run: mdbook build docs/ --dest-dir "$(pwd)/docs/book"

      - name: Copy WASM into book output
        run: |
          for f in ${{ env.WASM_MODULES }}; do
            cp "docs/src/playground/$f" "docs/book/html/playground/$f"
          done

      # Every deploy replaces whole site, so every deploy must carry
      # coverage report, not only ones triggered by Coverage run
      - name: Fetch latest coverage report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow coverage.yml --status success --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::no successful Coverage run yet; site ships without /coverage"
            exit 0
          fi
          gh run download "$run_id" --name coverage-html --dir docs/book/html/coverage

      - name: Confirm playground survived mdBook's asset copy
        run: |
          fail=0
          for f in ${{ env.WASM_MODULES }} ${{ env.PLAYGROUND_HTML }}; do
            p="docs/book/html/playground/$f"
            if [ -s "$p" ]; then
              echo " OK: $p"
            else
              echo " ERROR: $p missing from book output"
              fail=1
            fi
          done
          exit $fail

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/html

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
