name: Coverage

on:
  schedule:
    - cron: "11 3 * * 0" # Sundays 03:11 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          extra: lcov

      - uses: ./.github/actions/setup-gr

      - name: Build and run tests with coverage instrumentation
        run: |
          make clean
          make run-tests PLOT_BACKEND=GR USE_HDF5=1 USE_NETCDF=1 SANITIZE=0 \
            EXTRA_CFLAGS="-O0 -g --coverage"

      - name: Generate lcov report
        run: |
          lcov --capture --directory . --output-file coverage.info \
            --ignore-errors mismatch,gcov,source,negative
          lcov --remove coverage.info \
            '/usr/*' '*/third_party/*' '*/tests/*' '*/export/*' '*/benchmarks/*' \
            --output-file coverage.info --ignore-errors unused,negative

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            lcov --summary coverage.info 2>&1 | grep -E 'lines|functions|branches' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML report
        run: |
          genhtml coverage.info \
            --output-directory coverage-html \
            --title "QMC coverage report" \
            --legend \
            --highlight \
            --prefix "$PWD"

      - name: Upload coverage HTML as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
