name: Valgrind

on:
  schedule:
    - cron: "41 4 * * 0"   # Sundays 04:41 UTC, after coverage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valgrind
  cancel-in-progress: false

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
         with:
          extra: valgrind

      - uses: ./.github/actions/setup-gr

      - name: Run tests under Valgrind
        run: |
          make clean
          export LSAN_OPTIONS="suppressions=$PWD/lsan.supp"
          make valgrind
